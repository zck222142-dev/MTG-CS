name: Build Windows installer

on:
  workflow_dispatch:      # lets you click "Run workflow" on the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build the app
        run: python -m PyInstaller --noconfirm --windowed --name "MTG Card Scanner" --collect-all rapidocr_onnxruntime mtg_card_scanner.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MTG-Card-Scanner-Installer
          path: installer_output/MTG-Card-Scanner-Setup.exe
